name: Continuous Deployment (CD)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: |
          docker build -t toxic-comment-ai:${{ github.ref_name }} -f deployment/Dockerfile .
