version: '3.8'

services:
  api-gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: opentrust_api_gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveness')"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: opentrust_postgres
    environment:
      - POSTGRES_USER=opentrust
      - POSTGRES_PASSWORD=opentrust_pass
      - POSTGRES_DB=opentrust_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: opentrust_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
