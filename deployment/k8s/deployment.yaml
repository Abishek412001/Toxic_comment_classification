apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentrust-api-gateway
  namespace: opentrust-prod
  labels:
    app.kubernetes.io/name: opentrust-api-gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: opentrust-ai-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: opentrust-api-gateway
  template:
    metadata:
      labels:
        app: opentrust-api-gateway
    spec:
      containers:
      - name: api-gateway
        image: opentrust/api-gateway:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        envFrom:
        - configMapRef:
            name: opentrust-config
        - secretRef:
            name: opentrust-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: opentrust-api-gateway-service
  namespace: opentrust-prod
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: opentrust-api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opentrust-api-gateway-hpa
  namespace: opentrust-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opentrust-api-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
